name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request replaces a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The vcpkg commit of the builtin-baseline in vcpkg.json; keep them in step.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # vcpkg removed its GitHub Actions cache backend; built packages are kept
  # in a folder that actions/cache saves instead.
  VCPKG_BINARY_SOURCES: "clear;files,C:\\vcpkg-binary-cache,readwrite"

jobs:
  windows:
    name: Windows build (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Cache the vcpkg builds
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-binary-cache
          key: vcpkg-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
      - name: Configure
        shell: bash
        run: |
          mkdir -p /c/vcpkg-binary-cache
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -L unit
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/x2go | Out-Null
          Copy-Item build/casement-x2go.exe, plugin.json, icon.png, LICENSE, README.md, CHANGELOG.md dist/x2go/
      - uses: actions/upload-artifact@v4
        with:
          name: casement-x2go-windows-x64
          path: dist/

  linux:
    name: Cross build and end-to-end tests (MinGW, Wine)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 wine wine64 ninja-build cmake
      - name: Restore third-party builds
        uses: actions/cache@v4
        with:
          path: ~/mingw64
          key: mingw64-${{ hashFiles('ci/mingw-deps.sh') }}
      - name: Third-party libraries
        run: ci/mingw-deps.sh ~/mingw64 zlib openssl libssh2
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DCMAKE_PREFIX_PATH=$HOME/mingw64
      - name: Build
        run: cmake --build build
      - name: Wine prefix
        env:
          WINEDEBUG: -all
        run: wineboot --init && wineserver --wait
      - name: Unit tests
        env:
          WINEDEBUG: -all
        run: ctest --test-dir build --output-on-failure -L unit
      - name: End-to-end tests
        env:
          WINEDEBUG: -all
          CASEMENT_E2E: "1"
        run: ci/e2e.sh build
      - name: Server logs
        if: failure()
        run: |
          sudo tail -n 100 /tmp/casement-x2go-e2e/sshd/sshd.log || true
          sudo sh -c 'tail -n 50 /tmp/.x2go-x2gotest/C-*/session.log' || true
